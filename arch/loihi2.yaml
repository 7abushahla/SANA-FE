# Loihi 2 candidate architecture, numerical profile qcfs-if-int24-binary-v1.
# Topology: 8 x 4 routers, four neurocores/router, 128 neurocores total.
# Intel's 8 x 16 description counts CORES, not routers.
# Sources and limitations: docs/loihi2-profile.md and sanafe/loihi2.py.
# Timing, synchronization, and energy costs below are inherited Loihi 1
# estimates, NOT calibrated Loihi 2 measurements.
# One effective mesh is modeled; two physical fabrics are not explicit.
# Integer IF semantics are implemented directly, not via Intel microcode.
# Learning engines and embedded management CPUs are not modeled.
# Keep arch/loihi2.yaml and sanafe/examples/loihi2.yaml identical.
architecture:
  name: loihi2_candidate
  attributes:
    topology: mesh
    width: 8
    height: 4
    link_buffer_size: 16
    #sync_model: fixed
    #latency_sync: 0.0
    # Enable this if simulating with more detailed timing models
    sync_model: table
    latency_sync: { 1: 0.6e-6, 2: 1.0e-6, 4: 1.4e-6, 29: 1.8e-6 }
  tile:
    - name: loihi_tile[0..31]
      attributes:
        energy_north_hop: 4.2e-12
        latency_north_hop: 6.5e-9
        energy_east_hop: 3.0e-12
        latency_east_hop: 4.1e-9
        energy_south_hop: 4.2e-12
        latency_south_hop: 6.5e-9
        energy_west_hop: 3.0e-12
        latency_west_hop: 4.1e-9
      core:
        - name: loihi_core[0..3]
          attributes:
            buffer_position: soma
            buffer_inside_unit: false
            max_neurons_supported: 8192
          axon_in:
            - name: loihi_in
              attributes:
                energy_message_in: 0.0e-12
                latency_message_in: 16.0e-9
          soma:
            - name: loihi_lif
              attributes:
                model: integrate_fire_int24
                energy_access_neuron: 51.2e-12
                latency_access_neuron: 6.0e-9
                energy_update_neuron: 21.6e-12
                latency_update_neuron: 3.7e-9
                energy_spike_out: 69.3e-12
                latency_spike_out: 30.0e-9
          dendrite:
            - name: loihi_dendrites
              attributes:
                model: accumulator_int
                energy_update: 0.0
                latency_update: 0.0
          synapse:
            - name: loihi_dense_synapse  # Use the name to link
              attributes:
                model: current_based_int
                energy_process_spike: 35.5e-12
                latency_process_spike: 3.8e-9
          axon_out:
            - name: loihi_out
              attributes:
                energy_message_out: 111.0e-12
                latency_message_out: 5.1e-9
