time:
  latency_scale: 1.0
  status: inherited
  provenance:
    sources: 0
    rows: []
    note: No rate is moved, since the tolerance of the rates does not close the gap to the measured time,
      so every modeled time is uncalibrated. The structural result of the time model, an upper limit on
      the effective read cost per stored weight set by one deployment, is not expressible as a latency
      scale and is carried in readings.effective_read_cost_per_stored_weight_ns and in results/fit_time.json.
      On that deployment the simulator's own time was 3.6 to 3.8 times the measured time.
dynamic:
  energy_scale: 0.59657
  energy_scale_low: 0.490994
  energy_scale_high: 0.681578
  status: anchored
  provenance:
    sources: 1
    rows:
    - lavadl2022pilotnetlif-b9e3691:power-dynamic
    - lavadl2022pilotnetlif-b9e3691:throughput
    - lavadl2022pilotnetlif-baa23ad:power-dynamic
    - lavadl2022pilotnetlif-baa23ad:throughput
    note: The scale anchors the dynamic energy per inference, the published dynamic power times the measured
      time per timestep over the modeled dynamic energy per timestep, averaged over the two later runs
      of one deployment. A dynamic power from it divides that energy by a modeled time, which is uncalibrated,
      and a static energy grows in proportion to that time. The low end, 0.491, rests on the simulator's
      own PilotNet run under the builder partition, the partition the simulator executes, and holds for
      a network with PilotNet's excess message energy. The high end, 0.682, rests on the same event energies
      on the counts of the evidence partition, arithmetic outside the simulator, which has never run that
      partition, and holds for a network with no excess messages. The carried value, 0.597, is for the
      recorded runs of the thesis network (the mechanics cut sets of hand policy b). It is the high end
      times (1 - s (1 - r)), with s = 0.140 the thesis network's network share under the simulator's partition,
      estimated from its recorded counts with the profile's event energies, and r = 0.109 the ratio of
      network energy, evidence over builder, on PilotNet. That the thesis network's message energy falls
      as PilotNet's does is reasoning, not a measurement, and another network computes its own value from
      its own share. Every event energy is inherited from the first Loihi chip and scaled, not fitted.
      The published dynamic power of the three runs differs by a factor of 1.91, a floor on what any model
      can match. A recount of the thesis network under Lava's neuron order would resolve the bracket.
transfer:
- coefficient: dynamic.energy_scale, synaptic and network events
  from: cuba_lif_int24 (Lava's LIF, the PilotNet LIF deployment)
  to:
  - integrate_fire_int24
  - integrate_fire_int24_gated
  assumption: The scale anchored on a LIF network is applied to the synaptic and network event energies
    of the soft-reset IF units of ANN-to-SNN conversion, as the transfer of a synaptic or message cost
    between soma programs.
- coefficient: dynamic.energy_scale, soma events
  from: cuba_lif_int24 (Lava's LIF, the PilotNet LIF deployment)
  to:
  - integrate_fire_int24
  - integrate_fire_int24_gated
  assumption: A single scale on the total cannot be split by event class, so it is applied to the soma
    event energies of the soft-reset IF units only as a stated assumption. The soma events carry a share
    of 0.140 of the anchored energy of PilotNet LIF, and an estimated 0.14 to 0.21 of the simulated dynamic
    energy of the recorded runs of the thesis network. Leaving the soma energy unscaled would raise the
    thesis network's calibrated dynamic energy by 10 to 14 percent at the carried scale.
