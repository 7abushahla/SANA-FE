time:
  latency_scale: 1.0
  status: inherited
  provenance:
    sources: 0
    rows: []
    note: The latency scale is the identity and nothing was fitted. Time per timestep on PilotNet LIF
      is not fitted, not held out, in prose not fitted, consistent with the one deployment used to diagnose
      it (no held-out test). A time on any other network is from a timing model compared with one other
      deployment (PilotNet LIF, a leaky integrate-and-fire network, not held out) and not fitted. Under
      the partition the compiler printed, with the receive cost derived from the runtime model's link
      bandwidth, the simulator's own time on PilotNet LIF is 1.013 to 1.029 times the three measured times.
      That agreement is not a held-out test, since the deployment singled out the receive cost and does
      not identify it, and readings.time_per_timestep states it with its limits. The latency scale that
      would close the remaining difference is reported there and not carried. Estimator A moves no rate,
      since the tolerance of the rates does not close its gap to the measured time, and its structural
      result, an upper limit on the effective read cost per stored weight set by one deployment, is not
      expressible as a latency scale and is carried in readings.effective_read_cost_per_stored_weight_ns
      and in results/fit_time.json. Under the builder partition the simulator gives 1.72 to 2.04 times
      the measured time on the zero input over three placements.
dynamic:
  energy_scale: 0.682154
  energy_scale_low: 0.490994
  energy_scale_high: 0.682154
  status: anchored
  provenance:
    sources: 1
    rows:
    - lavadl2022pilotnetlif-b9e3691:power-dynamic
    - lavadl2022pilotnetlif-b9e3691:throughput
    - lavadl2022pilotnetlif-baa23ad:power-dynamic
    - lavadl2022pilotnetlif-baa23ad:throughput
    note: The scale, 0.682, holds only for counts taken in Lava's neuron order. Counts taken in the reader
      order, the default of the exporter of mixed-horizon-snn and of the fork's builder, must use readings.dynamic_energy_scale.carried_for_reader_order_records,
      the high end times (1 - s (1 - r)) with s their network share under the builder's layout and r =
      0.107 the ratio of network energy, printed over builder, on PilotNet, as results/fit_dynamic.json
      documents. For the earlier records of the thesis network, with s = 0.140, that value is 0.597. The
      scale anchors the dynamic energy per inference, the published dynamic power times the measured time
      per timestep over the modeled dynamic energy per timestep, averaged over the two later runs of one
      deployment. A dynamic power from it divides that energy by a modeled time, which is not fitted and
      was compared with one deployment only, and a static energy grows in proportion to that time. The
      low end, 0.491, rests on the simulator's own PilotNet run under the builder partition and holds
      for a network with PilotNet's excess message energy. The high end, 0.682, rests on the same event
      energies on the counts of the partition the compiler printed, which the simulator's own run under
      that partition reproduces, and holds for a network with no excess messages. Under the evidence partition,
      which the per-core plots select on two convolutions and leave open on the other layers, it was 0.6816,
      the value carried before the printed partition was read, kept as a reading. Near-equal slices on
      the dense layer of 100, which the printout labels with no slice shape, give 0.6821. Applying it
      to the new records of the thesis network assumes that the thesis network would be laid out on the
      chip in Lava's order, and the anchor rests on the inference that the published runs ran without
      their input. It raises their scaled dynamic energy by 14 percent over the reader-order value. In
      Lava's neuron order the network share of the thesis network is 0.026, estimated by the same method
      from the counts of the new records. The range from the low end to the high end is a range of the
      scale between the two partitions of PilotNet LIF. Every event energy is inherited from the first
      Loihi chip and scaled, not fitted. The published dynamic power of the three runs differs by a factor
      of 1.91, a floor on what any model can match.
transfer:
- coefficient: dynamic.energy_scale, synaptic and network events
  from: cuba_lif_int24 (Lava's LIF, the PilotNet LIF deployment)
  to:
  - integrate_fire_int24
  - integrate_fire_int24_gated
  assumption: The scale anchored on a LIF network is applied to the synaptic and network event energies
    of the soft-reset IF units of ANN-to-SNN conversion, as the transfer of a synaptic or message cost
    between soma programs.
- coefficient: dynamic.energy_scale, soma events
  from: cuba_lif_int24 (Lava's LIF, the PilotNet LIF deployment)
  to:
  - integrate_fire_int24
  - integrate_fire_int24_gated
  assumption: A single scale on the total cannot be split by event class, so it is applied to the soma
    event energies of the soft-reset IF units only as a stated assumption. The soma events carry a share
    of 0.141 of the anchored energy of PilotNet LIF, and an estimated 0.16 to 0.24 of the simulated dynamic
    energy of the new records of the thesis network (in Lava's neuron order) and 0.14 to 0.21 of the earlier
    records. Leaving the soma energy unscaled would raise the calibrated dynamic energy of the new records
    by 8 to 11 percent at the high end, and of the earlier records by 10 to 14 percent at their reader-order
    value.
- coefficient: time per timestep, the timing model of the simulator
  from: cuba_lif_int24 (Lava's LIF, the PilotNet LIF deployment)
  to:
  - integrate_fire_int24
  - integrate_fire_int24_gated
  assumption: The timing model was compared with one deployment only, PilotNet LIF at sparse activity,
    and that comparison is not a held-out test. Its credibility is carried to the soft-reset IF units
    of ANN-to-SNN conversion of the thesis network as an assumption, although the neuron model, the activity,
    the gated soma and the graded input emulated by weights all differ. A time of the simulator on that
    network is from a timing model compared with one other deployment (PilotNet LIF, a leaky integrate-and-fire
    network, not held out) and not fitted.
