    statement: Under the evidence partition and with the receive cost derived from the runtime model's
      link bandwidth, the simulator's own time per timestep on PilotNet LIF is 154.1 µs, the mean of three
      runs whose means differ by 0.04 percent, which lies 0.8 to 2.4 percent above the three published
      runs. No coefficient was fitted to the measured time. The receive cost comes from an independent
      published Loihi 2 measurement, the effective link bandwidth recorded in timcheck2026runtime-v2.
      The agreement is not an independent validation. The receive cost was singled out by an ablation
      on this same deployment, and the choice among the readings of the measurement (a 32-bit or an 8-bit
      message, the binary or the decimal reading of the bandwidth) was made with this comparison in view.
      All of those readings give 0.958 to 1.030 times the measured time, so the choice is not what produces
      the agreement, but the deployment was used to diagnose the model and cannot also count as a held-out
      test of it. Identifying a link bandwidth with the receive stage's cost per message is an assumption.
      The check rests on one deployment, one network family (a leaky integrate-and-fire network from lava-dl)
      and sparse activity. The evidence partition is selected by the per-core plots on two convolutions
      (on one when only their pattern across cores is used) and taken by consistency and Lava's own order
      on the other layers. With the notebook's camera frame as input the simulator gives 0.928 to 0.943
      times the measured time, below it, and the published runs most likely ran without the frame. The
      simulator has no synaptic memory read term, while estimator A has one and no receive term, so the
      upper limit on the read cost belongs to estimator A only. The hop latencies and the send latency
      remain inherited from the first Loihi chip. With every message and hop latency zero the time falls
      by 6.6 percent, and with the send latency alone zero by 0.1 percent. Under the builder partition,
      which the per-core plots contradict, the same profile gives 1.96 to 1.99 times the measured time.
      Before the adoption, with the first chip's receive cost, the evidence partition gave 1.25 to 1.27
      times.
