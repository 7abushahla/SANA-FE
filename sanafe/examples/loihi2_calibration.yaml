    statement: Under the partition the compiler printed and with the receive cost derived from the runtime
      model's link bandwidth, the simulator's own time per timestep on PilotNet LIF is 154.8 µs, the mean
      of three runs whose means differ by 0.02 percent, which lies 1.3 to 2.9 percent above the three
      published runs. Its label is "not fitted, consistent with the one deployment used to diagnose it
      (no held-out test)". No coefficient was fitted to the measured time. The receive cost comes from
      an independent published Loihi 2 measurement, the effective link bandwidth recorded in timcheck2026runtime-v2.
      The agreement is not an independent validation. The receive cost was singled out by an ablation
      on this same deployment, and the choice among the three readings of the measurement that were run
      (a 32-bit message over the binary reading of the bandwidth, a 32-bit message over the decimal reading
      and an 8-bit message over the binary reading) was made with this comparison in view. The three readings
      give 0.963 to 1.035 times the measured time. The deployment excludes the first chip's 16 ns, which
      gives 1.24 to 1.26 times the measured time, but does not identify the receive cost. With every message
      and hop latency set to zero the simulator still lies within 6 percent of the measurement (0.947
      to 0.962 times), and a line through the rows that differ only in the receive cost (2.825 µs per
      ns, 144.80 µs at zero) puts every receive cost from 0.1 to 4.7 ns within 5 percent of all three
      runs, and equality with them at 1.99 to 2.85 ns. The deployment was used to diagnose the model and
      cannot also count as a held-out test of it, and the examination of the timing model stopped when
      the agreement was reached. The coefficients not examined after it (the neuron update, the synaptic
      operation and the barrier, scaled from the first chip by Intel's factors, and the hop and send latencies,
      inherited) are untested by this comparison beyond their sum. Identifying a link bandwidth with the
      receive stage's cost per message is an assumption. The comparison rests on one deployment, one network
      family (a leaky integrate-and-fire network from lava-dl) and sparse activity. A time of the simulator
      on any other network is therefore labeled "from a timing model compared with one other deployment
      (PilotNet LIF, a leaky integrate-and-fire network, not held out) and not fitted". The division of
      the input layer and the five convolutions over their cores is the one the compiler printed for this
      deployment. The dense layer of 100 is not resolved by the printout, and near-equal slices on it
      change the time by +0.06 percent. The division the per-core plots select gives 1.009 to 1.025 times
      the measured time. With the notebook's camera frame as input the simulator gives 1.055 to 1.072
      times the measured time, above it, and the published runs most likely ran without the frame. The
      simulator has no synaptic memory read term, while estimator A has one and no receive term, so the
      upper limit on the read cost belongs to estimator A only. The hop latencies and the send latency
      remain inherited from the first Loihi chip. With every message and hop latency zero the time falls
      by 6.5 percent, and with the send latency alone zero by 0.1 percent. Under the builder partition,
      which the printout and the per-core plots contradict, the same profile gives 1.96 to 2.00 times
      the measured time.
