    statement: Under the evidence partition and with the receive cost derived from the runtime model's
      link bandwidth, the simulator's own time per timestep on PilotNet LIF is 154.1 µs, the mean of three
      runs whose means differ by 0.04 percent, which lies 0.8 to 2.4 percent above the three published
      runs. Its label is "not fitted, consistent with the one deployment used to diagnose it (no held-out
      test)". No coefficient was fitted to the measured time. The receive cost comes from an independent
      published Loihi 2 measurement, the effective link bandwidth recorded in timcheck2026runtime-v2.
      The agreement is not an independent validation. The receive cost was singled out by an ablation
      on this same deployment, and the choice among the three readings of the measurement that were run
      (a 32-bit message over the binary reading of the bandwidth, a 32-bit message over the decimal reading
      and an 8-bit message over the binary reading) was made with this comparison in view. The three readings
      give 0.958 to 1.030 times the measured time. The deployment excludes the first chip's 16 ns, which
      gives 1.25 to 1.27 times the measured time, but does not identify the receive cost. With every message
      and hop latency set to zero the simulator still lies within 6 percent of the measurement (0.941
      to 0.956 times), and a line through the rows that differ only in the receive cost (2.907 µs per
      ns, 143.82 µs at zero) puts every receive cost from 0.5 to 4.9 ns within 5 percent of all three
      runs, and equality with them at 2.27 to 3.11 ns. The deployment was used to diagnose the model and
      cannot also count as a held-out test of it, and the examination of the timing model stopped when
      the agreement was reached. The coefficients not examined after it (the neuron update, the synaptic
      operation and the barrier, scaled from the first chip by Intel's factors, and the hop and send latencies,
      inherited) are untested by this comparison beyond their sum. Identifying a link bandwidth with the
      receive stage's cost per message is an assumption. The comparison rests on one deployment, one network
      family (a leaky integrate-and-fire network from lava-dl) and sparse activity. A time of the simulator
      on any other network is therefore labeled "from a timing model compared with one other deployment
      (PilotNet LIF, a leaky integrate-and-fire network, not held out) and not fitted". The evidence partition
      is selected by the per-core plots on two convolutions (on one when only their pattern across cores
      is used) and taken by consistency and Lava's own order on the other layers. With the notebook's
      camera frame as input the simulator gives 0.928 to 0.943 times the measured time, below it, and
      the published runs most likely ran without the frame. The simulator has no synaptic memory read
      term, while estimator A has one and no receive term, so the upper limit on the read cost belongs
      to estimator A only. The hop latencies and the send latency remain inherited from the first Loihi
      chip. With every message and hop latency zero the time falls by 6.6 percent, and with the send latency
      alone zero by 0.1 percent. Under the builder partition, which the per-core plots contradict, the
      same profile gives 1.96 to 1.99 times the measured time.
