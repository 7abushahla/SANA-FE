# The dynamic energy scale of this file holds only for counts taken in Lava's neuron order. Counts in
# the reader order must use readings.dynamic_energy_scale.carried_for_reader_order_records.
# Generated by SANA-FE-thesis/calibration/fit/write_calibration.py from the three fit results
# named under readings.source_results. Do not edit by hand. Dynamic energy is anchored on one
# deployment and carried as a range. Time per timestep is not fitted, not held out
# (readings.time_per_timestep, which states the limits of the comparison with one deployment),
# so the latency scale is 1.0 and inherited. The read cost of estimator A is bounded by that
# deployment. Static power is fitted by scope and carried as two rules.
schema: loihi2-calibration-v1
represents: One Oheo Gulch chip of unknown revision. Dynamic energy is anchored on one deployment (PilotNet
  LIF, three runs of one notebook) and carried as a range. On that deployment the time per timestep is
  labeled "not fitted, not held out". On any other network it is labeled "from a timing model compared
  with one other deployment (PilotNet LIF, a leaky integrate-and-fire network, not held out) and not fitted".
  The read cost of estimator A is bounded by that deployment. Static power is a band from chip-scope sources
  of revisions N3C1 and N3C2 and of an unprinted revision and one core-scope source.
