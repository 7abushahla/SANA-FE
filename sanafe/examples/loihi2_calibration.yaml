# Generated by SANA-FE-thesis/calibration/fit/write_calibration.py from the three fit results
# named under readings.source_results. Do not edit by hand. Dynamic energy is anchored on one
# deployment and carried as a bracket. Time per timestep is checked on one deployment and not
# fitted (readings.time_per_timestep, which states the limits of that check), so the latency
# scale is 1.0 and inherited. The read cost of estimator A is bounded by that deployment.
# Static power is fitted by scope and carried as two rules.
