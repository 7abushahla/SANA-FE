      convolution in whole columns of Lava's order with the remainder on the last core, and the dense
      layer of 100, which the printout labels with no slice shape, in eleven slices of 9 and one of 1.
      Its printed counts are consistent with that division under a stated reading (the neuron and synapse
      columns of its row as floor means over its 12 cores, the synapse column as 64-bit words per axon),
      an inference from the table, since on the labeled rows the neuron column is the full slice. It is
      not the only division consistent with them, it agrees with the per-core memory bars (eleven equal
      cores and one lower), and it is the evidence partition's division, which the per-core plots leave
      undecided on this layer. The statement below, copied from results/fit_time.json, calls this layer
      not resolved by the printout and the evidence partition the division the per-core plots select,
      wording written before this reading and not regenerated. The plots select the evidence partition
      on two convolutions and leave it open on the other layers
